name: Regression Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      user:
        description: "Saucedemo user"
        type: choice
        default: standard_user
        options:
          - standard_user
          - problem_user

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v --html=reports/report.html --self-contained-html
        env:
          HEADLESS: "1"
          SAUCE_USER: ${{ inputs.user || 'standard_user' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/